name: build vsix

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
      - run: npm install
      - run: npm run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: memoryloupe
          path: "*.vsix"
